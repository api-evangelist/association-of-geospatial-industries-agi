aid: association-of-geospatial-industries-agi

name: Association of Geospatial Industries (AGI)

description: 'The Association of Geospatial Industries (AGI) is an industry‑led non‑profit organization that represents the geospatial sector in India and promotes the advancement of geospatial technologies and their applications. It provides a forum for designers, implementers and users of satellite remote sensing, aerial and drone‑based survey, LiDAR, GIS, cloud computing services and solutions, and it facilitates networking, knowledge sharing, business development and policy advocacy for its members.'

